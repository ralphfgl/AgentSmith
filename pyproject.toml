[project]
name = "agentsmith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ralph", email = "ralph8@live.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "mcp>=2.2.0",
    "openai>=3.20.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agentsmith = "agentsmith:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]

